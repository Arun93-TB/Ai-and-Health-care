{% extends "base.html" %}


{% block title %}
Register | AI Health Assistant
{% endblock %}



{% block content %}


<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">


<section class="register-section">


    <div class="register-container">


        <h1>
            <i class="fa-solid fa-user-plus"></i>
            Create Account
        </h1>


        <p>
            Join AI Health Assistant for AI-powered disease prediction
            and personalized health recommendations.
        </p>



        <form action="{{ url_for('register') }}" 
              method="POST"
              autocomplete="off">



            <!-- Full Name -->

            <div class="input-box">

                <label for="name">
                    Full Name
                </label>


                <div class="input-field">

                    <i class="fa-solid fa-user"></i>


                    <input 
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    minlength="3"
                    required>


                </div>

            </div>




            <!-- Email -->


            <div class="input-box">

                <label for="email">
                    Email Address
                </label>


                <div class="input-field">


                    <i class="fa-solid fa-envelope"></i>


                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                </div>


            </div>





            <!-- Phone -->


            <div class="input-box">


                <label for="phone">
                    Phone Number
                </label>


                <div class="input-field">


                    <i class="fa-solid fa-phone"></i>


                    <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="10 digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>


                </div>


            </div>





            <!-- Age -->


            <div class="input-box">


                <label for="age">
                    Age
                </label>


                <div class="input-field">


                    <i class="fa-solid fa-calendar"></i>


                    <input
                    type="number"
                    id="age"
                    name="age"
                    min="1"
                    max="120"
                    placeholder="Enter age"
                    required>


                </div>


            </div>





            <!-- Gender -->


            <div class="input-box">


                <label for="gender">
                    Gender
                </label>


                <div class="input-field">


                    <i class="fa-solid fa-venus-mars"></i>


                    <select 
                    id="gender"
                    name="gender"
                    required>


                        <option value="">
                            Select Gender
                        </option>


                        <option value="Male">
                            Male
                        </option>


                        <option value="Female">
                            Female
                        </option>


                        <option value="Other">
                            Other
                        </option>


                    </select>


                </div>


            </div>






            <!-- Password -->


            <div class="input-box">


                <label for="password">
                    Password
                </label>


                <div class="input-field">


                    <i class="fa-solid fa-lock"></i>


                    <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="6"
                    placeholder="Create password"
                    required>


                </div>


            </div>






            <!-- Confirm Password -->


            <div class="input-box">


                <label for="confirm_password">
                    Confirm Password
                </label>


                <div class="input-field">


                    <i class="fa-solid fa-lock"></i>


                    <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="6"
                    placeholder="Confirm password"
                    required>


                </div>


            </div>






            <!-- Password Strength -->


            <div class="password-strength">


                <div class="strength-bar">


                    <div id="strength-fill"></div>


                </div>


                <small id="strength-text">
                    Password Strength
                </small>


            </div>






            <!-- Terms -->


            <div class="terms">


                <label>


                    <input 
                    type="checkbox"
                    required>


                    I agree to Terms & Privacy Policy


                </label>


            </div>






            <!-- Button -->


            <button 
            type="submit"
            class="register-btn">


                <i class="fa-solid fa-user-check"></i>

                Create Account


            </button>



        </form>





        <p class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login Here
            </a>

        </p>




    </div>


</section>





<script>


const password = document.getElementById("password");

const fill = document.getElementById("strength-fill");

const text = document.getElementById("strength-text");



password.addEventListener("input",()=>{


    let length = password.value.length;



    if(length < 6){


        fill.style.width="30%";

        fill.style.background="red";

        text.innerHTML="Weak Password";


    }


    else if(length < 10){


        fill.style.width="70%";

        fill.style.background="orange";

        text.innerHTML="Medium Password";


    }


    else{


        fill.style.width="100%";

        fill.style.background="green";

        text.innerHTML="Strong Password";


    }


});



</script>



{% endblock %}
