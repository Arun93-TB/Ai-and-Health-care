{% extends "base.html" %}

{% block title %}
Disease Prediction | AI Health Assistant
{% endblock %}

{% block content %}

<section class="symptoms-page">

    <div class="page-title">

        <h1>
            <i class="fa-solid fa-stethoscope"></i>
            AI Disease Prediction
        </h1>

        <p>
            Fill in your health details and symptoms to receive an
            AI-powered disease prediction.
        </p>

    </div>

    <form action="/predict" method="POST" class="prediction-form">

        <div class="form-grid">

            <div class="input-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>

            <div class="input-group">

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    min="1"
                    max="120"
                    required>

            </div>

            <div class="input-group">

                <label>Gender</label>

                <select name="gender" required>

                    <option value="">Select Gender</option>

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                </select>

            </div>

            <div class="input-group">

                <label>Weight (kg)</label>

                <input
                    type="number"
                    name="weight"
                    required>

            </div>

            <div class="input-group">

                <label>Height (cm)</label>

                <input
                    type="number"
                    name="height"
                    required>

            </div>

            <div class="input-group">

                <label>Body Temperature (°C)</label>

                <input
                    type="number"
                    step="0.1"
                    name="temperature">

            </div>

            <div class="input-group">

                <label>Blood Pressure</label>

                <input
                    type="text"
                    name="bp"
                    placeholder="120/80">

            </div>

            <div class="input-group">

                <label>Blood Sugar</label>

                <input
                    type="number"
                    name="sugar">

            </div>

        </div>

        <h2>Select Symptoms</h2>

        <div class="symptoms-grid">

            <label><input type="checkbox" name="symptoms" value="Fever"> Fever</label>

            <label><input type="checkbox" name="symptoms" value="Cough"> Cough</label>

            <label><input type="checkbox" name="symptoms" value="Headache"> Headache</label>

            <label><input type="checkbox" name="symptoms" value="Vomiting"> Vomiting</label>

            <label><input type="checkbox" name="symptoms" value="Nausea"> Nausea</label>

            <label><input type="checkbox" name="symptoms" value="Fatigue"> Fatigue</label>

            <label><input type="checkbox" name="symptoms" value="Chest Pain"> Chest Pain</label>

            <label><input type="checkbox" name="symptoms" value="Shortness of Breath"> Shortness of Breath</label>

            <label><input type="checkbox" name="symptoms" value="Sore Throat"> Sore Throat</label>

            <label><input type="checkbox" name="symptoms" value="Dizziness"> Dizziness</label>

            <label><input type="checkbox" name="symptoms" value="Body Pain"> Body Pain</label>

            <label><input type="checkbox" name="symptoms" value="Diarrhea"> Diarrhea</label>

            <label><input type="checkbox" name="symptoms" value="Joint Pain"> Joint Pain</label>

            <label><input type="checkbox" name="symptoms" value="Loss of Taste"> Loss of Taste</label>

            <label><input type="checkbox" name="symptoms" value="Loss of Smell"> Loss of Smell</label>

        </div>

        <h2>Lifestyle Information</h2>

        <div class="form-grid">

            <div class="input-group">

                <label>Smoking</label>

                <select name="smoking">

                    <option>No</option>

                    <option>Yes</option>

                </select>

            </div>

            <div class="input-group">

                <label>Alcohol</label>

                <select name="alcohol">

                    <option>No</option>

                    <option>Yes</option>

                </select>

            </div>

            <div class="input-group">

                <label>Exercise</label>

                <select name="exercise">

                    <option>Daily</option>

                    <option>Weekly</option>

                    <option>Rarely</option>

                </select>

            </div>

            <div class="input-group">

                <label>Family History</label>

                <select name="family_history">

                    <option>No</option>

                    <option>Yes</option>

                </select>

            </div>

        </div>

        <div class="predict-button">

            <button type="submit">

                <i class="fa-solid fa-brain"></i>

                Predict Disease

            </button>

        </div>

    </form>

</section>

{% endblock %}
