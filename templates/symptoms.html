{% extends "base.html" %}

{% block title %}
AI Disease Prediction
{% endblock %}

{% block content %}

<section class="symptoms-section">

    <h1>AI Disease Prediction</h1>

    <p>
        Enter your details and select your symptoms to predict the possible disease.
    </p>

    <form action="{{ url_for('symptoms') }}" method="POST">

        <h2>Personal Details</h2>

        <div class="input-group">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required>

        </div>

        <div class="input-group">

            <label>Age</label>

            <input
                type="number"
                name="age"
                min="1"
                max="120"
                required>

        </div>

        <div class="input-group">

            <label>Gender</label>

            <select name="gender" required>

                <option value="">Select Gender</option>

                <option value="Male">Male</option>

                <option value="Female">Female</option>

                <option value="Other">Other</option>

            </select>

        </div>

        <hr>

        <h2>Select Symptoms</h2>

        <div class="input-group">

            <label>Fever</label>

            <select name="fever">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <div class="input-group">

            <label>Cough</label>

            <select name="cough">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <div class="input-group">

            <label>Headache</label>

            <select name="headache">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <div class="input-group">

            <label>Fatigue</label>

            <select name="fatigue">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <div class="input-group">

            <label>Body Pain</label>

            <select name="body_pain">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <div class="input-group">

            <label>Vomiting</label>

            <select name="vomiting">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <div class="input-group">

            <label>Difficulty Breathing</label>

            <select name="breathing">

                <option value="No">No</option>

                <option value="Yes">Yes</option>

            </select>

        </div>

        <br>

        <button type="submit">

            Predict Disease

        </button>

    </form>

</section>

{% endblock %}
